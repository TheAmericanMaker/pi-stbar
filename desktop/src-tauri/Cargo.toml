[package]
name = "pi-stbar-desktop"
version = "0.1.0"
description = "pi-stbar desktop — STBAR-skinned pi agent with native FS + shell"
authors = ["James Sesler (TheAmericanMaker)"]
edition = "2021"

[lib]
name = "pi_stbar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
